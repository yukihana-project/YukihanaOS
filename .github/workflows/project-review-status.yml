name: Sync Project Status with Review State

on:
  pull_request:
    types:
      - ready_for_review
      - converted_to_draft
  pull_request_review:
    types: 
     - submitted

permissions:
  contents: read
  pull-requests: read
  issues: read
  repository-projects: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Determine desired status
        id: status
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.event.action }}" == "ready_for_review" ]]; then
              echo "status=${{ vars.STATUS_IN_REVIEW_ID }}" >> "$GITHUB_OUTPUT"
            elif [[ "${{ github.event.action }}" == "converted_to_draft" ]]; then
              echo "status=${{ vars.STATUS_IN_PROGRESS_ID }}" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ github.event_name }}" == "pull_request_review" ]]; then
            if [[ "${{ github.event.review.state }}" == "changes_requested" ]]; then
              echo "status=${{ vars.STATUS_IN_PROGRESS_ID }}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Update linked issues in Project
        uses: actions/github-script@v9
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          STATUS_FIELD_ID: ${{ vars.STATUS_FIELD_ID }}
          STATUS_OPTION_ID: ${{ steps.status.outputs.status }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

             const { repository } = context.repo;

            const result = await github.graphql(`
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first:20) {
                      nodes {
                        id
                        number
                      }
                    }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number
            });

            const issues =
              result.repository.pullRequest.closingIssuesReferences.nodes;

            if (issues.length === 0) {
              core.info("No linked issues found.");
              return;
            }

            for (const issue of issues) {

              const itemResult = await github.graphql(`
                query($project:ID!, $issue:ID!) {
                  node(id:$project) {
                    ... on ProjectV2 {
                      items(first:100) {
                        nodes {
                          id
                          content {
                            ... on Issue {
                              id
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `,{
                project: process.env.PROJECT_ID,
                issue: issue.id
              });

              const item = itemResult.node.items.nodes.find(
                i => i.content && i.content.id === issue.id
              );

              if (!item) {
                core.info(`Issue #${issue.number} not found in project`);
                continue;
              }

              await github.graphql(`
                mutation(
                  $project:ID!,
                  $item:ID!,
                  $field:ID!,
                  $option:String!
                ) {
                  updateProjectV2ItemFieldValue(
                    input:{
                      projectId:$project
                      itemId:$item
                      fieldId:$field
                      value:{
                        singleSelectOptionId:$option
                      }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `,{
                project: process.env.PROJECT_ID,
                item: item.id,
                field: process.env.STATUS_FIELD_ID,
                option: process.env.STATUS_OPTION_ID
              });

              core.info(`Updated issue #${issue.number}`);
            }

        
