name: Sync Project Status with Review State

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: "Pull request number to simulate"
        required: true
        type: number

      action:
        description: "Status transition to simulate"
        required: true
        type: choice
        options:
          - ready_for_review
          - converted_to_draft
          - changes_requested
          - approved
          - merged

      dry-run:
        description: "Don't modify the project"
        required: true
        default: true
        type: boolean

  pull_request:
    types:
      - ready_for_review
      - converted_to_draft
      - closed

  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  update-status:
    name: 📝 Update Project Status
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 📝 Update linked issues in Project
        uses: actions/github-script@v9
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          STATUS_FIELD_ID: ${{ vars.STATUS_FIELD_ID }}
          STATUS_IN_PROGRESS_ID: ${{ vars.STATUS_IN_PROGRESS_ID }}
          STATUS_IN_REVIEW_ID: ${{ vars.STATUS_IN_REVIEW_ID }}
          STATUS_READY_FOR_MERGE_ID: ${{ vars.STATUS_READY_FOR_MERGE_ID }}
          STATUS_DONE_ID: ${{ vars.STATUS_DONE_ID }}

          TEST_PR_NUMBER: ${{ inputs.pr-number }}
          TEST_ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            let pr;
            let transition;

            if (context.eventName === "workflow_dispatch") {
              const prNumber = Number(process.env.TEST_PR_NUMBER);
              transition = process.env.TEST_ACTION;

              core.info(`Testing PR #${prNumber} (${transition})`);

              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });

              pr = data;
            } else {
              pr = context.payload.pull_request;

              if (context.eventName === "pull_request") {
                transition = context.payload.action;
              } else {
                transition = context.payload.review.state;
              }
            }

            let status = null;

            switch (transition) {
              case "ready_for_review":
                status = process.env.STATUS_IN_REVIEW_ID;
                break;

              case "converted_to_draft":
              case "changes_requested":
                status = process.env.STATUS_IN_PROGRESS_ID;
                break;

              case "approved":
                status = process.env.STATUS_READY_FOR_MERGE_ID;
                break;

              case "merged":
                status = process.env.STATUS_DONE_ID;
                break;

              case "closed":
                if (pr.merged) {
                  status = process.env.STATUS_DONE_ID;
                }
                break;
            }

            if (!status) {
              core.info("Nothing to update.");
              return;
            }

            const linkedIssues = await github.graphql(`
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first:20) {
                      nodes {
                        id
                        number
                      }
                    }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number
            });

            const issues =
              linkedIssues.repository.pullRequest.closingIssuesReferences.nodes;

            if (issues.length === 0) {
              core.info("No linked issues.");
              return;
            }

            const project = await github.graphql(`
              query($project:ID!) {
                node(id:$project) {
                  ... on ProjectV2 {
                    items(first:100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, {
              project: process.env.PROJECT_ID
            });

            const items = project.node.items.nodes;

            const dryRun = process.env.DRY_RUN === "true";

            for (const issue of issues) {
              const item = items.find(i => i.content?.id === issue.id);

              if (!item) {
                core.info(`Issue #${issue.number} is not in the project.`);
                continue;
              }

              if (dryRun) {
                core.info(
                  `[DRY RUN] Would update issue #${issue.number} to status ${status}`
                );
                continue;
              }

              await github.graphql(`
                mutation(
                  $project:ID!,
                  $item:ID!,
                  $field:ID!,
                  $option:String!
                ) {
                  updateProjectV2ItemFieldValue(
                    input:{
                      projectId:$project
                      itemId:$item
                      fieldId:$field
                      value:{
                        singleSelectOptionId:$option
                      }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `, {
                project: process.env.PROJECT_ID,
                item: item.id,
                field: process.env.STATUS_FIELD_ID,
                option: status
              });

              core.info(`Updated issue #${issue.number}`);
            }
