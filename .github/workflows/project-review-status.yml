name: Sync Project Status with Review State

on:
  pull_request:
    types:
      - ready_for_review
      - converted_to_draft
      - closed

  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  pull-requests: read
  issues: read
  repository-projects: write

jobs:
  update-status:
    name: 📝 Update Project Status
    runs-on: ubuntu-latest

    steps:
      - name: 📝 Update linked issues in Project
        uses: actions/github-script@v9
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          STATUS_FIELD_ID: ${{ vars.STATUS_FIELD_ID }}
          STATUS_IN_PROGRESS_ID: ${{ vars.STATUS_IN_PROGRESS_ID }}
          STATUS_IN_REVIEW_ID: ${{ vars.STATUS_IN_REVIEW_ID }}
          STATUS_READY_FOR_MERGE_ID: ${{ vars.STATUS_READY_FOR_MERGE_ID }}
          STATUS_DONE_ID: ${{ vars.STATUS_DONE_ID }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            let status = null;

            if (context.eventName === "pull_request") {
              switch (context.payload.action) {
                case "ready_for_review":
                  status = process.env.STATUS_IN_REVIEW_ID;
                  break;

                case "converted_to_draft":
                  status = process.env.STATUS_IN_PROGRESS_ID;
                  break;

                case "closed":
                  if (pr.merged) {
                    status = process.env.STATUS_DONE_ID;
                  }
                  break;
              }
            }

            if (context.eventName === "pull_request_review") {
              switch (context.payload.review.state) {
                case "changes_requested":
                  status = process.env.STATUS_IN_PROGRESS_ID;
                  break;

                case "approved":
                  status = process.env.STATUS_READY_FOR_MERGE_ID;
                  break;
              }
            }

            if (!status) {
              core.info("No project status update required.");
              return;
            }

            const linkedIssues = await github.graphql(`
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first:20) {
                      nodes {
                        id
                        number
                      }
                    }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number
            });

            const issues =
              linkedIssues.repository.pullRequest.closingIssuesReferences.nodes;

            if (!issues.length) {
              core.info("No linked issues found.");
              return;
            }

            const project = await github.graphql(`
              query($project:ID!) {
                node(id:$project) {
                  ... on ProjectV2 {
                    items(first:100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, {
              project: process.env.PROJECT_ID
            });

            const items = project.node.items.nodes;

            for (const issue of issues) {
              const item = items.find(
                i => i.content?.id === issue.id
              );

              if (!item) {
                core.info(\`Issue #\${issue.number} is not in the project.\`);
                continue;
              }

              await github.graphql(`
                mutation(
                  $project:ID!,
                  $item:ID!,
                  $field:ID!,
                  $option:String!
                ) {
                  updateProjectV2ItemFieldValue(
                    input:{
                      projectId:$project
                      itemId:$item
                      fieldId:$field
                      value:{
                        singleSelectOptionId:$option
                      }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `, {
                project: process.env.PROJECT_ID,
                item: item.id,
                field: process.env.STATUS_FIELD_ID,
                option: status
              });

              core.info(\`Updated issue #\${issue.number}\`);
            }