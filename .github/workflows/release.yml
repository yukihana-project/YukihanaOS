name: Release YukihanaOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.*"

jobs:
  build:
    name: Build (${{ matrix.arch }} / ${{ matrix.preset }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
        preset:
          - full

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Add .NET tools
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install Cosmos.Tools
        run: dotnet tool install -g Cosmos.Tools

      - name: Install Cosmos
        run: cosmos install -y

      - name: Build YKConfig
        working-directory: src/Yukihana
        run: dotnet build ../Yukihana.BuildConfig/Yukihana.BuildConfig.csproj

      - name: Initialize configuration
        working-directory: src/Yukihana
        run: ./ykconfig init

      - name: Configure preset
        working-directory: src/Yukihana
        run: ./ykconfig configure ${{ matrix.preset }} -v

      - name: Build kernel
        working-directory: src/Yukihana
        run: cosmos build -v -c Release -a ${{ matrix.arch }}

      - name: Rename ISO
        run: |
          mkdir release

          cp \
            src/Yukihana/output-${{ matrix.arch }}/Yukihana.iso \
            release/YukihanaOS-v${{ github.event.inputs.version }}-${{ matrix.preset }}-${{ matrix.arch }}.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: iso-${{ matrix.arch }}-${{ matrix.preset }}
          path: release/*.iso

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git checkout -b release/v${{ github.event.inputs.version }}
          git push origin release/v${{ github.event.inputs.version }}

      - name: Create tag
        run: |
          git tag v${{ github.event.inputs.version }}
          git push origin v${{ github.event.inputs.version }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          mkdir assets
          find release-assets -name "*.iso" -exec cp {} assets/ \;

      - name: Generate SHA256SUMS
        working-directory: assets
        run: sha256sum *.iso > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          target_commitish: release/v${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            assets/*.iso
            assets/SHA256SUMS
