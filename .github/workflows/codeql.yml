name: CodeQL Advanced

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  schedule:
    - cron: '19 5 * * 3'

permissions:
  security-events: write
  actions: read
  contents: read
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none

          - language: csharp
            build-mode: manual
            enabled: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🧰 Setup .NET
        if: matrix.build-mode == 'manual'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/NuGet.config

      - name: 🛣️ Add .NET tools to PATH
        if: matrix.build-mode == 'manual'
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: 📦 Cache Cosmos tools
        if: matrix.build-mode == 'manual'
        uses: actions/cache@v6
        with:
          path: ~/.cosmos/tools
          key: ${{ runner.os }}-cosmos-v1

      - name: 📦 Install Cosmos.Tools
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          dotnet tool install -g Cosmos.Tools

      - name: ⚙️ Install Cosmos packages
        if: matrix.build-mode == 'manual'
        run: cosmos install -y

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: 🛠 Build YKConfig
        if: matrix.build-mode == 'manual'
        working-directory: src/Yukihana.BuildConfig
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: 📂 Initialize build configuration
        if: matrix.build-mode == 'manual'
        working-directory: src/Yukihana
        run: ./ykconfig init

      - name: ✒️ Configure build
        if: matrix.build-mode == 'manual'
        working-directory: src/Yukihana
        run: ./ykconfig configure full -v

      - name: 🚀 Build kernel
        if: matrix.build-mode == 'manual'
        working-directory: src/Yukihana
        run: cosmos build -v -c Release -a x64

      - name: 🔎 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
