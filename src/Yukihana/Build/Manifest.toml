version = 1

[metadata]
name = "Yukihana OS"
description = "Feature configuration manifest"

[[group]]
id = "kernel"
name = "Kernel"

[[group]]
id = "debug"
name = "Debug"

[[group]]
id = "debug.logger"
name = "Logger"
parent = "debug"

[[group]]
id = "display"
name = "Display"

[[group]]
id = "archive"
name = "Archive"

[[feature]]
id = "archives"
name = "Archive Formats"
group = "archive"

description = "Compressors and cpio/tar readers"

sources = [
    "Core/Compression/ArchiveCompressorFactory.cs",
    "Core/Compression/IArchiveCompressor.cs",
    "Core/Compression/Bzip2ArchiveCompressor.cs",
    "Core/Compression/GzipArchiveCompressor.cs",
    "Core/Compression/Archives/ArchivatorFactory.cs",
    "Core/Compression/Archives/ArchiveEntry.cs",
    "Core/Compression/Archives/ArchiveEntryKind.cs",
    "Core/Compression/Archives/ArchiveImage.cs",
    "Core/Compression/Archives/ArchiveKind.cs",
    "Core/Compression/Archives/ArchivePath.cs",
    "Core/Compression/Archives/CpioArchivator.cs",
    "Core/Compression/Archives/IArchivator.cs",
    "Core/Compression/Archives/TarArchivator.cs"
]

# ------------------
# Features
# ------------------

[[feature]]
id = "init_ram_fs"
name = "InitRamFS"
group = "kernel"

description = "Allows kernel to load temporary filesystem from archive."

define = "FEATURE_INIT_RAM_FS"
enabled_by_default = true

# The initramfs reads archives, so it turns the archive feature on
select = ["archives"]

sources = [
    "Vfs/Filesystem/InitFs/InitFsSuperBlock.cs",
    "Vfs/Filesystem/InitFs/InitfsFileOperations.cs",
    "Vfs/Filesystem/InitFs/InitfsFilesystemType.cs",
    "Vfs/Filesystem/InitFs/InitfsInode.cs",
    "Vfs/Filesystem/InitFs/InitfsInodeOperations.cs",
    "Vfs/Filesystem/InitFs/InitfsOpenFile.cs",
    "Vfs/Filesystem/InitFs/InitfsSuperblockOperations.cs"
]

[[feature]]
id = "sinks_serial"
name = "Serial Sink"
group = "debug.logger"

description = "Enables kernel to log to serial port"

define = "FEATURE_SERIAL_SINK"

# Files this feature owns. They compile only while the feature is enabled
sources = [
    "Debug/Sinks/SerialSink.cs"
]

[[feature]]
id = "console_font"
name = "Console Font"
group = "display"

description = "Loads the console font from the filesystem"

define = "FEATURE_CONSOLE_FONT"
enabled_by_default = true

sources = [
    "Resources/Fonts.cs"
]